# Publica uma versão nova do MigradorEmails.exe.
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# O GitHub compila o .exe num Windows e cria a página da versão (Releases) com o
# executável e o .sha256. Os apps da equipe encontram a versão nova sozinhos.
name: Publicar versão

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write  # para criar a Release

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar as dependências e o PyInstaller
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.22.3

      - name: Gerar o executável
        run: python build.py ${{ github.ref_name }}

      - name: Testar o executável
        shell: pwsh
        run: |
          # o .exe monta a interface e fecha; se faltar algo no pacote, a versão não é publicada
          $p = Start-Process dist\MigradorEmails.exe -ArgumentList "--verificar" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "o executável falhou ao abrir (código $($p.ExitCode))" }

      - name: Publicar a Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # enquanto a versão for 0.x, ela sai marcada como pré-versão (Alpha)
          $tag = "${{ github.ref_name }}"
          $titulo = "Migrador de E-mails $tag"
          $extra = @()
          if ($tag -match '^v?0\.') { $titulo += " (Alpha)"; $extra += "--prerelease" }
          gh release create $tag dist/MigradorEmails.exe dist/MigradorEmails.exe.sha256 `
            --title $titulo --generate-notes @extra
          if ($LASTEXITCODE -ne 0) { throw "falha ao criar a Release" }
